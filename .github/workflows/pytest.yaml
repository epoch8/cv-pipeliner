name: Python package

on: [push]

jobs:
  build_and_test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Get files from Git LFS
      run: |
        git lfs fetch
        git lfs pull
    - name: Install dependencies
      run: |
        uv sync --group dev --extra torch --extra tensorflow --extra notebooks
        # Default Linux torch wheels pull CUDA+triton; triton native import can
        # segfault on CPU-only GitHub runners (seen on Python 3.13).
        uv pip uninstall -y triton || true
    - name: Lint with flake8
      run: |
        # Lint package + tests only (.venv lives in-repo with uv and must not be scanned)
        uv run flake8 cv_pipeliner tests --count --select=E9,F63,F7,F82 --show-source --statistics --ignore F821
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run flake8 cv_pipeliner tests --ignore=C901,F821 --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      env:
        TORCHDYNAMO_DISABLE: "1"
        CUDA_VISIBLE_DEVICES: ""
      run: |
        uv run pytest
